name: Build and Release Wheels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          args: --release --out dist
          manylinux: 2_28
          working-directory: bindings/python
          before-script-linux: |
            dnf install -y openssl-devel
            ARCH=$(uname -m)
            curl -Lo /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-linux-${ARCH}.zip
            unzip -o /tmp/protoc.zip -d /usr/local bin/protoc && chmod +x /usr/local/bin/protoc

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: bindings/python/dist/*.whl

  release:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(python3 -c "
          import re
          with open('bindings/python/pyproject.toml') as f:
              content = f.read()
          match = re.search(r'version\s*=\s*\"(.+?)\"', content)
          print(match.group(1))
          ")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: List wheels
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            Automated release from commit ${{ github.sha }}

            ## Install

            Find the wheel for your platform below and install with:
            ```
            pip install <wheel-url>
            ```

            Or install the latest release directly:
            ```
            pip install sglang-router --find-links https://github.com/${{ github.repository }}/releases/latest
            ```
          files: dist/*.whl
          generate_release_notes: true
