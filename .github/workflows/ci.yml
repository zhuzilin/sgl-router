name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Configure optional sccache
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo "sccache is unavailable; using rustc directly."
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            exit 0
          fi

          rustc_path="$(rustup which rustc)"
          if SCCACHE_GHA_ENABLED=false sccache "$rustc_path" -vV >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          else
            echo "sccache failed to start; using rustc directly."
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install protobuf compiler and redis
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler redis-server

      - name: Cache Cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Check compilation
        run: cargo check --all-targets --features vendored-openssl

      - name: Run tests
        run: cargo test --features vendored-openssl

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Configure optional sccache
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo "sccache is unavailable; using rustc directly."
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            exit 0
          fi

          rustc_path="$(rustup which rustc)"
          if SCCACHE_GHA_ENABLED=false sccache "$rustc_path" -vV >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          else
            echo "sccache failed to start; using rustc directly."
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo registry & git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Clippy
        run: cargo clippy --all-targets --features vendored-openssl -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  build-wheel:
    name: Build wheel (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          args: --profile ci --out dist
          manylinux: 2_28
          working-directory: bindings/python
          sccache: 'false'
          before-script-linux: |
            dnf install -y openssl-devel
            ARCH=$(uname -m)
            curl -Lo /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-linux-${ARCH}.zip
            unzip -o /tmp/protoc.zip -d /usr/local bin/protoc && chmod +x /usr/local/bin/protoc

      - name: Install and verify wheel
        run: |
          pip install bindings/python/dist/*.whl
          python -c "import sglang_router; print('Import OK')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: bindings/python/dist/*.whl
          retention-days: 1

  python-tests:
    name: Python tests
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist/

      - name: Install wheel and test deps
        run: |
          pip install dist/*.whl
          pip install pytest

      - name: Run Python tests
        run: pytest bindings/python/tests/ -v
