name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check compilation
        run: cargo check --all-targets --features vendored-openssl

      - name: Run tests
        run: cargo test --features vendored-openssl

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets --features vendored-openssl -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  build-wheel:
    name: Build wheel (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          args: --release --out dist
          manylinux: 2_28
          manifest-path: bindings/python/Cargo.toml
          before-script-linux: |
            dnf install -y openssl-devel

      - name: Install and verify wheel
        run: |
          pip install dist/*.whl
          python -c "import sglang_router; print('Import OK')"

  python-tests:
    name: Python tests
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          args: --release --out dist
          manylinux: 2_28
          manifest-path: bindings/python/Cargo.toml
          before-script-linux: |
            dnf install -y openssl-devel

      - name: Install wheel and test deps
        run: |
          pip install dist/*.whl
          pip install pytest

      - name: Run Python tests
        run: pytest bindings/python/tests/ -v
